name: friendly_meals
description: "FriendlyMeals Flutter sample app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.7+1
  firebase_core: ^4.0.0
  firebase_ai: ^3.13.1
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_remote_config: ^6.0.0
  firebase_app_check: ^0.4.0
  firebase_performance: ^0.11.0
  image_picker: ^1.2.0
  camera: ^0.11.0
  record: ^6.0.0
  audioplayers: ^6.0.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  image: ^4.5.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ic_launcher_no_bg.png
